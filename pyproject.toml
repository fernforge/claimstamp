[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimstamp"
version = "0.2.0"
description = "Ground an agent's claims in commands it actually ran, not commands it says it ran."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fernforge" }]
keywords = ["agent", "verification", "provenance", "ci", "llm", "claims", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fernforgehq/claimstamp"
Repository = "https://github.com/fernforgehq/claimstamp"

[project.scripts]
claimstamp = "claimstamp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
